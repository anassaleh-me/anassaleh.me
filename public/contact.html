<!doctype html>
<html lang="en" data-palette="paper">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact, Anas Saleh</title>
<meta name="description" content="Start a project with Anas Saleh: design, video editing, filming, 3D and animation in Dubai.">
<meta property="og:title" content="Contact, Anas Saleh">
<meta property="og:image" content="https://anassaleh.me/images/og.jpg">
<meta name="theme-color" content="#151514">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/site.css">
<script src="/js/palette.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.4/dist/lenis.min.js"></script>
<script type="module" src="/js/site.js"></script>
</head>
<body data-page="contact">
<a class="skip" href="#main">Skip to content</a>
<header id="nav"></header>
<main id="main">
  <header class="page-head wrap">
    <p class="eyebrow" data-reveal>Contact</p>
    <h1 class="display" data-reveal="1" data-c-headline>Let's make something.</h1>
    <p class="lead muted" data-reveal="2" data-c-intro>Tell me about your project.</p>
  </header>

  <section class="wrap" style="padding-bottom:clamp(80px,12vw,160px)">
    <div class="direct" data-direct></div>

    <div class="section-head" style="margin-bottom:32px">
      <h2 class="display" style="font-size:var(--step-2)" data-reveal>Or tell me about your project</h2>
      <p class="muted" style="margin:0" data-reveal="1" data-c-reply></p>
    </div>

    <div data-form-wrap>
      <form class="form" novalidate data-form>
        <div class="field">
          <label for="f-name">Your name <span class="req">*</span></label>
          <input id="f-name" name="name" type="text" autocomplete="name" required maxlength="120">
          <span class="error" aria-live="polite"></span>
        </div>
        <div class="field">
          <label for="f-company">Company or brand</label>
          <input id="f-company" name="company" type="text" autocomplete="organization" maxlength="120">
          <span class="error"></span>
        </div>
        <div class="field">
          <label for="f-email">Email <span class="req">*</span></label>
          <input id="f-email" name="email" type="email" autocomplete="email" required maxlength="200">
          <span class="error" aria-live="polite"></span>
        </div>
        <div class="field">
          <label for="f-phone">Phone or WhatsApp <span class="req">*</span></label>
          <input id="f-phone" name="phone" type="tel" autocomplete="tel" required maxlength="40" placeholder="+971 50 000 0000">
          <span class="error" aria-live="polite"></span>
        </div>
        <div class="field field--full">
          <fieldset>
            <legend>What do you need? <span class="req">*</span> <span class="hint" style="text-transform:none;letter-spacing:0">Pick one or more</span></legend>
            <div class="choice-list" data-services></div>
          </fieldset>
          <span class="error" aria-live="polite" data-services-error></span>
        </div>
        <div class="field field--full">
          <label for="f-brief">Project brief <span class="req">*</span></label>
          <textarea id="f-brief" name="brief" required maxlength="5000" placeholder="What are we making, who is it for, and what should it achieve? Links to references are welcome."></textarea>
          <span class="error" aria-live="polite"></span>
        </div>
        <div class="field">
          <label for="f-budget">Budget</label>
          <select id="f-budget" name="budget" data-budgets></select>
          <span class="error"></span>
        </div>
        <div class="field">
          <label for="f-date">Deadline or event date</label>
          <input id="f-date" name="date" type="date">
          <span class="error"></span>
        </div>
        <div class="field">
          <label for="f-source">How did you find me?</label>
          <select id="f-source" name="source" data-sources></select>
          <span class="error"></span>
        </div>
        <div class="field">
          <label for="f-links">Links (references, files, your website)</label>
          <input id="f-links" name="links" type="text" maxlength="500" placeholder="https://">
          <span class="error"></span>
        </div>
        <div class="hp" aria-hidden="true">
          <label for="f-website">Leave this empty</label>
          <input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>
        <div class="field field--full">
          <div class="consent">
            <input id="f-consent" name="consent" type="checkbox" required>
            <label for="f-consent">You can contact me by email, phone or WhatsApp about this request. My details are only used to reply.</label>
          </div>
          <span class="error" aria-live="polite"></span>
        </div>
        <div class="form__foot">
          <p class="form__status" role="status" aria-live="polite"></p>
          <button class="btn" type="submit">Send request <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </form>
    </div>
  </section>
</main>
<footer id="footer"></footer>
</body>
</html>
