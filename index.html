<style>
/* Layout: one calm screen in the CV's language. Dark rail on the left, the name set large, contact underneath. */
:root{
  --paper:#F6F2E7; --ink:#1F1E1B; --muted:#6C685F; --line:#D8D3C5; --rail:#2A2A28;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#161513;--ink:#ECE7DA;--muted:#9C978B;--line:#2F2D29;--rail:#0B0B0A;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#161513;--ink:#ECE7DA;--muted:#9C978B;--line:#2F2D29;--rail:#0B0B0A;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:500;font-size:18px;line-height:1.5;-webkit-font-smoothing:antialiased}
.rail{position:fixed;left:0;top:0;bottom:0;width:12px;background:var(--rail)}
main{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;gap:48px;max-width:1100px;margin:0 auto;padding-block:40px 32px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
@media (min-width:760px){main{padding-left:max(64px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px));padding-block:56px 40px}}
.top{display:flex;justify-content:space-between;gap:16px;font-family:var(--mono);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:8px}
.status i{width:8px;height:8px;border-radius:50%;background:#3E8E5A}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(48px,10.5vw,132px);line-height:.9;letter-spacing:-1px;text-wrap:balance}
.role{margin:20px 0 0;font-size:clamp(20px,2.4vw,26px);font-weight:500;max-width:36ch}
.role b{font-weight:700}
.disc{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.disc span{font-family:var(--mono);font-size:12px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--line);padding:4px 10px;color:var(--muted)}
.bottom{display:grid;gap:28px;border-top:1px solid var(--line);padding-top:28px}
@media (min-width:760px){.bottom{grid-template-columns:1fr auto;align-items:end}}
.contact{display:grid;gap:14px}
.label{font-family:var(--mono);font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.mail{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.mail a{font-size:clamp(20px,2.4vw,26px);font-weight:600;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--line);word-break:break-all;transition:border-color .25s}
.mail a:hover{border-color:var(--ink)}
.copy{font-family:var(--body);font-weight:700;font-size:13px;letter-spacing:.8px;text-transform:uppercase;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:6px 11px;cursor:pointer}
.icons{display:flex;gap:10px;flex-wrap:wrap}
.icons a{width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);color:var(--ink);transition:background .25s,color .25s,border-color .25s}
.icons a:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.icons svg{width:20px;height:20px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);padding:15px 24px;text-decoration:none;font-weight:700;text-transform:uppercase;letter-spacing:.8px;font-size:15px;justify-self:start;transition:transform .3s}
.btn:hover{transform:translateY(-2px)}
.btn svg{width:16px;height:16px}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted)}
.fade{animation:fade .9s ease both}.fade.d2{animation-delay:.12s}.fade.d3{animation-delay:.24s}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>

</head>
<body>

  <section class="bottom">
    <div class="contact">

      <div class="mail"><a href="mailto:anassors.200@gmail.com" id="mail">anassors.200@gmail.com</a><button class="copy" id="copy" type="button">Copy</button></div>
      <div class="icons">
        <a href="https://www.linkedin.com/in/anas-al-sheikh-saleh/" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 110 5 2.5 2.5 0 010-5zM3 9h4v12H3zM9 9h3.8v1.7h.05c.53-1 1.83-2.05 3.77-2.05C20.6 8.65 21 11.2 21 14.5V21h-4v-5.8c0-1.4 0-3.2-1.95-3.2S13 13.5 13 15.1V21H9z"/></svg></a>

        <a href="https://wa.me/971567061214" target="_blank" rel="noopener" aria-label="WhatsApp" title="WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 2.9 2.9 0 00-.9 2.2c0 1.3.9 2.5 1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.6-.3z"/></svg></a>
      </div>
    </div>
    <a class="btn" href="Anas_Al_Shikh_Saleh_CV.pdf" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12M6 10l6 6 6-6M4 20h16"/></svg>Download CV</a>
  </section>

  <div class="foot"><span>anassaleh.me</span><span>&copy; <span id="yr">2026</span> Anas Al Shikh Saleh</span></div>
</main>
<script>
document.getElementById("yr").textContent=new Date().getFullYear();
document.getElementById("copy").addEventListener("click",function(){
  var b=this,t=document.getElementById("mail").textContent;
  var sel=function(){var r=document.createRange();r.selectNodeContents(document.getElementById("mail"));var s=getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText(t).then(function(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy"},1600)},sel)}catch(e){sel()}
});
</script>
