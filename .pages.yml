# Pages CMS config (https://pagescms.org). One section per page of the site; each edits its own JSON file in
# public/content/. Every page and every home section has a "Show" switch. The site combines the files itself.
media:
  - name: images
    label: Images
    input: public/images
    output: /images
    extensions: [webp, jpg, jpeg, png, gif, svg, avif, mp4, webm]
  - name: files
    label: Files
    input: public/files
    output: /files
    extensions: [pdf, glb, gltf, mp4, webm]

content:
  # ---------------------------------------------------------------- Home
  - name: home
    label: "Home"
    type: file
    path: public/content/home.json
    format: json
    fields:
      - { name: headline, label: Headline under the name, type: string }
      - { name: intro, label: Intro line, type: text }
      - { name: statement, label: "Big statement (put a word in [brackets] to colour it blue)", type: text }
      - { name: statementSub, label: Line under the statement, type: text }
      - { name: heroImage, label: Portrait (transparent background), type: image, options: { media: images } }
      - { name: heroDepth, label: Portrait depth map (grayscale, white is near), type: image, options: { media: images } }
      - name: heroGlow
        label: Glow around the portrait
        type: select
        options:
          values:
            - { name: none, label: None }
            - { name: very-light, label: Very light }
            - { name: light, label: Light }
            - { name: strong, label: Stronger }
      - name: disciplines
        label: "Section: What I do"
        type: object
        fields:
          - { name: show, label: Show this section, type: boolean, default: true }
          - name: items
            label: Words (each shows that kind of work on hover)
            type: object
            list: true
            fields:
              - { name: title, label: Word, type: string }
              - { name: filter, label: "Shows on hover: a category name (Traditional art = your drawings)", type: string }
              - { name: image, label: Picture if no project matches, type: image, options: { media: images } }
      - name: works
        label: "Section: Selected work (the wheel shows projects ticked Show on homepage)"
        type: object
        fields:
          - { name: show, label: Show this section, type: boolean, default: true }
          - { name: label, label: Title in the middle of the wheel, type: string }
      - name: spider
        label: "Section: Mechanical Spider 3D"
        type: object
        fields:
          - { name: show, label: Show this section, type: boolean, default: true }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: model, label: "3D model (.glb, under 10 MB). Empty = placeholder", type: file, options: { media: files } }
          - { name: poster, label: Still image, type: image, options: { media: images } }
          - { name: link, label: Link, type: string }
      - name: inProgress
        label: "Section: In progress (shows the items of the In progress page)"
        type: object
        fields:
          - { name: show, label: Show this section, type: boolean, default: true }
      - name: drawings
        label: "Section: Drawings"
        type: object
        fields:
          - { name: show, label: Show this section, type: boolean, default: true }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: images, label: Drawings, type: image, options: { media: images, multiple: true } }
      - name: contact
        label: "Section: Let's talk"
        type: object
        fields:
          - { name: show, label: Show this section, type: boolean, default: true }

  # ---------------------------------------------------------------- Work
  - name: work
    label: "Work page"
    type: file
    path: public/content/work.json
    format: json
    fields:
      - { name: show, label: Show this page, type: boolean, default: true }
      - { name: intro, label: Intro line, type: text }
      - name: all
        label: "Banner for All (when no filter is picked)"
        type: object
        fields:
          - { name: label, label: Title, type: string }
          - { name: description, label: Short line, type: string }
          - { name: banner, label: "Banner image (wide, about 2000 x 700)", type: image, options: { media: images } }
      - name: categories
        label: "Categories: order of the filters, plus a line and banner for each. Add one here or just type a new name on a project; a filter shows only when a project uses it"
        type: object
        list: true
        fields:
          - { name: name, label: "Name (written the same as on the projects)", type: string, required: true }
          - { name: show, label: Show as a filter, type: boolean, default: true }
          - { name: description, label: Short line, type: string }
          - { name: banner, label: "Banner image (wide, about 2000 x 700)", type: image, options: { media: images } }

  # ---------------------------------------------------------------- Services
  - name: services
    label: "Services page"
    type: file
    path: public/content/services.json
    format: json
    fields:
      - { name: show, label: Show this page, type: boolean, default: true }
      - { name: headline, label: "Title (put [brackets] round the blue words)", type: string }
      - { name: intro, label: Intro line, type: text }
      - name: items
        label: Services
        type: object
        list: true
        fields:
          - { name: name, label: Name, type: string, required: true }
          - { name: line, label: Short line, type: text }
          - { name: note, label: "Note under it (optional, e.g. how the price is set)", type: text }
          - { name: formService, label: "Ticks this choice on the contact form (written the same as there: Design, 3D, Drawing, Video editing, Filming)", type: string }
          - { name: examples, label: "Examples: the newest projects from these categories (names, separated by commas)", type: string }
          - { name: images, label: "Or pick example images yourself (shown instead)", type: image, list: true, options: { media: images } }
          - name: packages
            label: Packages
            type: object
            list: true
            fields:
              - { name: name, label: Name, type: string, required: true }
              - { name: text, label: Short line, type: text }
              - { name: includes, label: "What's included (one per line)", type: string, list: true }
      - name: process
        label: How we work
        type: object
        fields:
          - { name: title, label: "Title (put [brackets] round the blue words)", type: string }
          - { name: intro, label: Intro line, type: text }
          - name: steps
            label: Steps
            type: object
            list: true
            fields:
              - { name: title, label: Step, type: string, required: true }
              - { name: text, label: What happens, type: text }
      - name: faq
        label: Questions
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - name: items
            label: Questions
            type: object
            list: true
            fields:
              - { name: q, label: Question, type: string, required: true }
              - { name: a, label: Answer, type: text }
      - { name: cta, label: Line above the Start a project button, type: text }

  # ---------------------------------------------------------------- Projects
  - name: projects
    label: Projects
    type: file
    path: public/content/projects.json
    format: json
    list: true
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: subtitle, label: Subtitle, type: string }
      - name: slug
        label: Page address (lowercase-with-dashes)
        type: string
        required: true
        pattern: { regex: "^[a-z0-9]+(-[a-z0-9]+)*$", message: "Use lowercase letters, numbers and dashes only" }
      - name: categories
        label: "Categories: type a name per line, as many as fit (Art direction, Branding & graphic design, 3D design, Animation, Video production, UI & UX, Traditional art). A new name makes a new category"
        type: string
        list: true
      - { name: client, label: Client, type: string }
      - { name: year, label: Year, type: string }
      - name: date
        label: "Date for the order (year-month, e.g. 2025-10). Newest shows first"
        type: string
        pattern: { regex: '^(\d{4}-\d{2})?$', message: "Write it as year-month, for example 2025-10" }
      - { name: role, label: My role, type: string }
      - { name: format, label: Format, type: string }
      - { name: tools, label: Tools and gear, type: string }
      - { name: featured, label: Show on homepage (in the works wheel), type: boolean }
      - { name: draft, label: Hide from site (draft), type: boolean }
      - { name: cover, label: "Cover image (about 1600 x 1250, used on the cards, the project page and link previews)", type: image, options: { media: images } }
      - { name: description, label: Description, type: text }
      - { name: video, label: "Film link (Vimeo, or YouTube). Shown with a play button", type: string }
      - name: blocks
        label: "Layout: rows from top to bottom"
        description: "Works like Behance modules. Each row can have a short text and up to 8 images side by side (same height, never cropped). Drag rows to reorder. Short animations: upload an .mp4 loop instead of a GIF."
        type: object
        list: true
        fields:
          - { name: text, label: "Text above the images (optional)", type: text }
          - { name: images, label: "Images or .mp4 loops side by side (1 = full width, up to 8)", type: file, options: { media: images, multiple: { max: 8 } } }
          - { name: caption, label: "Caption under the row (optional)", type: string }

  # ---------------------------------------------------------------- About
  - name: about
    label: "About page"
    type: file
    path: public/content/about.json
    format: json
    fields:
      - { name: show, label: Show this page, type: boolean, default: true }
      - { name: portrait, label: Portrait, type: image, options: { media: images } }
      - { name: bio, label: Story (paragraphs), type: text, list: true }
      - name: experience
        label: Experience
        type: object
        list: true
        fields:
          - { name: period, label: Period (e.g. 2024 to 2026), type: string }
          - { name: role, label: Role, type: string }
          - { name: company, label: Company, type: string }
          - { name: note, label: Note, type: string }
      - { name: tools, label: "Tools: Create (design, 3D, film)", type: string, list: true }
      - { name: workflowTools, label: "Tools: Workflow (organising, AI)", type: string, list: true }

  # ---------------------------------------------------------------- Contact
  - name: contact
    label: "Contact page"
    type: file
    path: public/content/contact.json
    format: json
    fields:
      - { name: show, label: "Show this page (when off, the Let's talk buttons write an email instead)", type: boolean, default: true }
      - { name: headline, label: Headline, type: string }
      - { name: intro, label: Intro, type: text }
      - { name: replyNote, label: Reply time note, type: string }
      - { name: services, label: Services in the form, type: string, list: true }
      - { name: budgets, label: Budget options, type: string, list: true }
      - { name: sources, label: "How did you find me? options", type: string, list: true }

  # ---------------------------------------------------------------- In progress
  - name: progress
    label: "In progress page"
    type: file
    path: public/content/progress.json
    format: json
    fields:
      - { name: show, label: "Show this page (it also hides itself when there are no items)", type: boolean, default: true }
      - name: items
        label: What you're making now
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - name: status
            label: Status
            type: select
            options:
              values:
                - { name: in-production, label: In the works }
                - { name: coming-soon, label: Coming soon }
                - { name: idea, label: Idea }
          - { name: text, label: Text, type: text }
          - { name: image, label: Image, type: image, options: { media: images } }
          - { name: details, label: "Longer note (optional)", type: text }
          - { name: gallery, label: "Extra images (optional)", type: image, options: { media: images, multiple: { max: 6 } } }
          - { name: link, label: "Link (optional, for example /film)", type: string }

  # ---------------------------------------------------------------- Film diary
  - name: film
    label: "Film diary page (/film)"
    type: file
    path: public/content/film.json
    format: json
    fields:
      - { name: show, label: Show this page, type: boolean }
      - { name: title, label: Film title, type: string }
      - { name: logline, label: Logline (one sentence), type: text }
      - { name: poster, label: Poster or key still, type: image, options: { media: images } }
      - name: stage
        label: Current stage
        type: select
        options:
          values:
            - { name: development, label: Development }
            - { name: pre-production, label: Pre-production }
            - { name: production, label: Production }
            - { name: post-production, label: Post-production }
            - { name: release, label: Release }
      - { name: about, label: About the film, type: text }
      - name: diary
        label: Production diary
        type: object
        list: true
        fields:
          - { name: date, label: Date, type: date }
          - { name: title, label: Title, type: string }
          - { name: text, label: Text, type: text }
          - { name: image, label: Image, type: image, options: { media: images } }

  # ---------------------------------------------------------------- Journal
  - name: journal
    label: "Journal page"
    type: file
    path: public/content/journal.json
    format: json
    fields:
      - { name: show, label: "Show the journal (adds it to the menu)", type: boolean }
      - { name: intro, label: Intro line, type: text }

  - name: blog
    label: "Journal entries"
    type: file
    path: public/content/blog.json
    format: json
    list: true
    fields:
      - { name: title, label: Title, type: string, required: true }
      - name: slug
        label: Page address (lowercase-with-dashes)
        type: string
        required: true
        pattern: { regex: "^[a-z0-9]+(-[a-z0-9]+)*$", message: "Use lowercase letters, numbers and dashes only" }
      - { name: date, label: Date, type: date }
      - { name: tag, label: "Tag (for example Story, Process, Things I love, Tips)", type: string }
      - { name: excerpt, label: "Short intro (shown on the list and in link previews)", type: text }
      - { name: cover, label: Cover image, type: image, options: { media: images } }
      - { name: draft, label: "Draft (only visible with ?preview)", type: boolean }
      - name: blocks
        label: "Entry: rows from top to bottom"
        description: "Each row can have formatted text and up to 8 images or .mp4 loops side by side, plus a caption."
        type: object
        list: true
        fields:
          - { name: text, label: Text, type: rich-text }
          - { name: images, label: "Images or .mp4 loops side by side (optional, up to 8)", type: file, options: { media: images, multiple: { max: 8 } } }
          - { name: caption, label: "Caption under the images (optional)", type: string }

  # ---------------------------------------------------------------- Settings
  - name: settings
    label: "Settings (name, email, social links, CV)"
    type: file
    path: public/content/settings.json
    format: json
    fields:
      - { name: name, label: Short name (shown on the site), type: string, required: true }
      - { name: fullName, label: Full name, type: string, required: true }
      - { name: location, label: Location, type: string }
      - { name: cv, label: CV (PDF), type: file, options: { media: files } }
      - name: contact
        label: Contact and social links
        type: object
        fields:
          - { name: email, label: Email, type: string }
          - { name: linkedin, label: LinkedIn URL, type: string }
          - { name: behance, label: Behance URL, type: string }
          - { name: instagram, label: Instagram URL, type: string }
          - { name: whatsapp, label: WhatsApp link (https://wa.me/...), type: string }

  - name: offers
    label: Offers (hidden on the site until used)
    type: file
    path: public/content/offers.json
    format: json
    list: true
    fields:
      - { name: name, label: Name, type: string, required: true }
      - { name: image, label: Image, type: image, options: { media: images } }
      - { name: price, label: Price, type: string }
      - { name: description, label: Description, type: text }
      - { name: buyLink, label: Buy link, type: string }
